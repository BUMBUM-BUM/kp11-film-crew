<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КП11 — Центр Креативных Технологий</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0d0f12; color: #f3f4f6; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Навбар -->
  <header class="border-b border-gray-800 bg-black/40 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="bg-amber-500 text-black font-extrabold px-2 py-1 rounded text-sm tracking-wider">КП11</span>
        <h1 class="text-lg font-bold tracking-tight">КИНО & ТЕЛЕПРОИЗВОДСТВО</h1>
      </div>
      <div id="authButtons" class="flex space-x-3">
        <button onclick="showModal('login')" class="text-sm font-medium hover:text-amber-400 transition">Вход</button>
        <button onclick="showModal('register')" class="text-sm bg-amber-500 text-black px-4 py-2 rounded-lg font-semibold hover:bg-amber-400 transition">Регистрация</button>
      </div>
    </div>
  </header>

  <!-- Главный баннер -->
  <main class="flex-grow max-w-7xl mx-auto px-4 py-12 w-full">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <span class="text-xs font-mono bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full uppercase tracking-widest">Система учёта съёмок и практики</span>
      <h2 class="text-4xl md:text-5xl font-extrabold mt-4 mb-6 tracking-tight">Платформа для съёмочных команд колледжа №11</h2>
      <p class="text-gray-400 text-lg">Автоматизация выездов, студийных съёмок, набора съёмочных групп и контроля профпригодности студентов.</p>
    </div>

    <!-- Модальное окно Вход / Регистрация -->
    <div id="modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md relative">
        <button onclick="hideModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white">✕</button>
        <h3 id="modalTitle" class="text-xl font-bold mb-4">Вход в систему</h3>
        
        <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
          <div id="registerFields" class="hidden space-y-4">
            <div>
              <label class="block text-xs font-mono text-gray-400 mb-1">ФИО</label>
              <input type="text" id="fullName" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-xs font-mono text-gray-400 mb-1">Роль</label>
              <select id="role" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
                <option value="STUDENT">Студент</option>
                <option value="TEACHER">Преподаватель</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-mono text-gray-400 mb-1">Email</label>
            <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-mono text-gray-400 mb-1">Пароль</label>
            <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <button type="submit" class="w-full bg-amber-500 text-black py-2.5 rounded-lg font-bold hover:bg-amber-400 transition mt-2">Продолжить</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-600">
    © 2026 Колледж предпринимательства №11 — Центр Креативных Технологий
  </footer>

  <script>
    let isRegister = false;
    function showModal(type) {
      isRegister = type === 'register';
      document.getElementById('modalTitle').innerText = isRegister ? 'Регистрация' : 'Вход в систему';
      document.getElementById('registerFields').classList.toggle('hidden', !isRegister);
      document.getElementById('modal').classList.remove('hidden');
    }
    function hideModal() {
      document.getElementById('modal').classList.add('hidden');
    }
    async function handleAuth(e) {
      e.preventDefault();
      const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        fullName: isRegister ? document.getElementById('fullName').value : undefined,
        role: isRegister ? document.getElementById('role').value : undefined,
      };
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        localStorage.setItem('token', data.token);
        alert('Успешно!');
        hideModal();
        location.reload();
      } catch(err) {
        alert(err.message);
      }
    }
  </script>
</body>
</html>
